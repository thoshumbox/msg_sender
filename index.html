<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>send msg ig</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app">
    <section class="card">

      <div class="header">
        <div class="logo">w</div>

        <div>
          <h1>send msg ig</h1>
          <p>type something and send it</p>
        </div>
      </div>

      <form id="messageForm">

        <label for="username">
          name <span>optional</span>
        </label>

        <input
          id="username"
          type="text"
          maxlength="80"
          placeholder="type a name"
        >

        <label for="message">
          message
        </label>

        <textarea
          id="message"
          rows="7"
          maxlength="2000"
          placeholder="say something..."
          required
        ></textarea>

        <div class="counter">
          <span id="status">ready</span>
          <span><b id="charCount">0</b>/2000</span>
        </div>

        <label for="image">
          image <span>optional</span>
        </label>

        <input
          id="image"
          type="url"
          placeholder="paste image url"
        >

        <div id="preview" class="image-preview hidden">
          <img id="previewImage" alt="">
        </div>

        <button id="sendButton" type="submit">
          <span id="buttonText">send msg ig</span>
          <span id="spinner" class="spinner hidden"></span>
        </button>

      </form>

      <div id="result" class="result hidden"></div>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
